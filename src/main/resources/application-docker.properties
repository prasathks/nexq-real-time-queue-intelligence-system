# Application config for Docker profile (MySQL + Redis)

# MySQL settings (Credentials injected via docker-compose env vars)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Redis is configured via env vars in docker-compose.yml
# (SPRING_DATA_REDIS_HOST and SPRING_DATA_REDIS_PORT)

# Keep other default settings from application.properties
