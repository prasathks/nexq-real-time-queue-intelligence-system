<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexQ — User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="dashboard-page">
<nav class="navbar nexq-navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#"><div class="brand-logo-sm"><i class="bi bi-collection"></i></div>NexQ</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <span class="badge role-badge" id="roleBadge">USER</span>
            <span class="text-light" id="userNameNav"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
        </div>
    </div>
</nav>
<div class="container-fluid px-4 py-4">
    <div class="welcome-banner mb-4">
        <div><h2 class="mb-1">Welcome, <span id="userNameWelcome">User</span>! 👋</h2>
        <p class="mb-0 opacity-75">Join a queue and track your token in real-time</p></div>
        <div class="welcome-icon"><i class="bi bi-ticket-perforated"></i></div>
    </div>
    <div id="activeTokenSection" class="d-none mb-4">
        <h5 class="section-title"><i class="bi bi-ticket-perforated me-2"></i>My Active Token</h5>
        <div class="row g-3" id="activeTokenCards"></div>
    </div>
    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="section-title mb-0"><i class="bi bi-list-ul me-2"></i>Available Queues</h5>
            <button class="btn btn-sm btn-outline-nexq" onclick="loadQueues()"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
        </div>
        <div id="queuesAlert" class="alert d-none"></div>
        <div class="row g-3" id="queuesGrid">
            <div class="col-12 text-center py-5"><div class="spinner-border text-purple"></div></div>
        </div>
    </div>
    <div>
        <h5 class="section-title"><i class="bi bi-clock-history me-2"></i>My Token History</h5>
        <div class="card nexq-card"><div class="card-body p-0">
            <div class="table-responsive">
                <table class="table nexq-table mb-0">
                    <thead><tr><th>Token #</th><th>Queue</th><th>Status</th><th>Issued At</th><th>Expires</th></tr></thead>
                    <tbody id="tokenHistoryBody"><tr><td colspan="5" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div></div>
    </div>
</div>
<div class="modal fade" id="joinQueueModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content nexq-modal">
            <div class="modal-header border-0">
                <h5 class="modal-title"><i class="bi bi-plus-circle me-2 text-purple"></i>Join Queue</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="joinQueueInfo"></div>
                <div class="mt-3">
                    <label class="form-label text-muted small mb-1">Priority Level</label>
                    <select class="form-select" id="joinPriority">
                        <option value="0">🟢 Normal</option>
                        <option value="1">🟡 Priority (e.g. Elderly/Pregnant)</option>
                        <option value="2">🚨 Emergency</option>
                    </select>
                </div>
                <div id="joinQueueAlert" class="alert d-none mt-3"></div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary-nexq" id="confirmJoinBtn" onclick="confirmJoin()">
                    <i class="bi bi-ticket-perforated me-2"></i>Get My Token
                </button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="js/app.js"></script>
<script>
    requireAuth('USER');
    const user = JSON.parse(localStorage.getItem('nexq_user') || '{}');
    document.getElementById('userNameNav').textContent = user.name || '';
    document.getElementById('userNameWelcome').textContent = (user.name || 'User').split(' ')[0];
    document.getElementById('roleBadge').textContent = user.role || 'USER';
    let selectedQueueId = null;
    let stompClient = null;
    let subscribedQueues = new Set();

    function connectWebSocket() {
        if (stompClient) return;
        const socket = new SockJS('/ws-nexq');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Disable debug logs
        stompClient.connect({}, function(frame) {
            console.log('Connected to WebSocket');
            // We subscribe to queues after they are loaded
        }, function(error) {
            console.error('WebSocket error:', error);
            setTimeout(connectWebSocket, 5000); // Reconnect
        });
    }

    window.onload = () => { 
        connectWebSocket();
        loadQueues().then(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const joinQueueId = urlParams.get('joinQueue');
            if (joinQueueId) {
                const btn = document.querySelector(`button[data-queue-id="${joinQueueId}"]`);
                if (btn && !btn.disabled) btn.click();
            }
        });
        loadMyTokens(); 
    };

    async function loadQueues() {
        try {
            const queues = await apiGet('/api/queues');
            const grid = document.getElementById('queuesGrid');
            if (!queues.length) { grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-inbox display-4 d-block"></i>No active queues</div>'; return; }
            grid.innerHTML = queues.map(q => {
                const isFull = q.maxCapacity && q.waitingCount >= q.maxCapacity;
                const capacityText = q.maxCapacity ? ` <span class="fs-6 text-muted">/ ${q.maxCapacity}</span>` : '';
                return `
                <div class="col-12 col-md-6 col-xl-4">
                    <div class="queue-card">
                        <div class="queue-card-header">
                            <div><h6 class="queue-name">${escHtml(q.name)}</h6>
                            <span class="queue-location"><i class="bi bi-geo-alt me-1"></i>${escHtml(q.location||'No location')}</span></div>
                            <div class="queue-status-dot ${q.isActive?'active':'inactive'}"></div>
                        </div>
                        <p class="queue-desc">${escHtml(q.description||'No description')}</p>
                        <div class="queue-stats">
                            <div class="stat-item"><span class="stat-value text-warning">${q.waitingCount}${capacityText}</span><span class="stat-label">Waiting</span></div>
                            <div class="stat-item"><span class="stat-value text-success">${q.servingCount}</span><span class="stat-label">Serving</span></div>
                            <div class="stat-item"><span class="stat-value text-info">${q.completedToday}</span><span class="stat-label">Done</span></div>
                        </div>
                        <div class="queue-footer">
                            <span class="text-muted small">~${q.waitingCount*5} min wait</span>
                            <button class="btn btn-sm btn-primary-nexq" data-queue-id="${q.id}" onclick="openJoinModal(${q.id},'${escHtml(q.name)}',${q.waitingCount},${q.maxCapacity})" ${isFull ? 'disabled' : ''}>
                                <i class="bi ${isFull ? 'bi-slash-circle' : 'bi-plus'} me-1"></i>${isFull ? 'Queue Full' : 'Join Queue'}
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            // Subscribe to queue topics if not already subscribed
            if (stompClient && stompClient.connected) {
                queues.forEach(q => {
                    if (!subscribedQueues.has(q.id)) {
                        stompClient.subscribe('/topic/queue/' + q.id, function(message) {
                            loadQueues(); // Reload on update
                        });
                        subscribedQueues.add(q.id);
                    }
                });
            }
        } catch(err) { showAlertIn('queuesAlert','Failed to load queues','danger'); }
    }

    async function loadMyTokens() {
        try {
            const tokens = await apiGet('/api/tokens/my');
            const active = tokens.filter(t => t.status==='WAITING'||t.status==='SERVING');
            if (active.length) {
                document.getElementById('activeTokenSection').classList.remove('d-none');
                document.getElementById('activeTokenCards').innerHTML = active.map(t => `
                    <div class="col-12 col-md-6"><div class="token-card ${t.status.toLowerCase()}">
                        <div class="token-number">#${t.tokenNumber}</div>
                        <div class="token-queue">${escHtml(t.queueName)}</div>
                        <span class="token-status-badge ${t.status.toLowerCase()}">${t.status}</span>
                        ${t.priorityWeight > 0 ? `<span class="badge bg-danger ms-2">${t.priorityWeight === 2 ? '🚨 Emergency' : '🟡 Priority'}</span>` : ''}
                        <div class="token-info mt-2">
                            <span><i class="bi bi-people me-1"></i>Pos: ${t.positionInQueue||'-'}</span>
                            <span><i class="bi bi-clock me-1"></i>~${t.estimatedWaitMinutes||0} min</span>
                        </div>
                    </div></div>`).join('');
            }
            const tbody = document.getElementById('tokenHistoryBody');
            tbody.innerHTML = !tokens.length ? '<tr><td colspan="5" class="text-center py-4 text-muted">No tokens yet</td></tr>' :
                tokens.map(t => `<tr>
                    <td><span class="fw-bold text-purple">#${t.tokenNumber}</span>
                        ${t.priorityWeight > 0 ? (t.priorityWeight===2?'🚨':'🟡') : ''}</td>
                    <td>${escHtml(t.queueName)}</td>
                    <td><span class="badge status-badge-${t.status.toLowerCase()}">${t.status}</span></td>
                    <td>${formatDate(t.issuedAt)}</td>
                    <td>${formatDate(t.expiresAt)}</td></tr>`).join('');
        } catch(err) { console.error(err); }
    }

    function openJoinModal(queueId, queueName, waiting, maxCapacity) {
        selectedQueueId = queueId;
        const capacityText = maxCapacity ? ` / ${maxCapacity}` : '';
        document.getElementById('joinQueueInfo').innerHTML = `
            <div class="text-center py-3">
                <div class="join-queue-icon mx-auto mb-3"><i class="bi bi-ticket-perforated"></i></div>
                <h5>${escHtml(queueName)}</h5>
                <p class="text-muted"><strong class="text-warning">${waiting}${capacityText}</strong> waiting · ~${waiting*5} min</p>
            </div>`;
        document.getElementById('joinQueueAlert').classList.add('d-none');
        new bootstrap.Modal(document.getElementById('joinQueueModal')).show();
    }

    async function confirmJoin() {
        if (!selectedQueueId) return;
        const btn = document.getElementById('confirmJoinBtn');
        const priority = document.getElementById('joinPriority').value;
        btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Joining...';
        try {
            await apiPost(`/api/queues/${selectedQueueId}/tokens`, { priorityWeight: parseInt(priority) });
            bootstrap.Modal.getInstance(document.getElementById('joinQueueModal')).hide();
            await loadMyTokens(); await loadQueues();
        } catch(err) { showAlertIn('joinQueueAlert', err.message||'Failed to join', 'danger'); }
        finally { btn.disabled=false; btn.innerHTML='<i class="bi bi-ticket-perforated me-2"></i>Get My Token'; }
    }
</script>
</body>
</html>
