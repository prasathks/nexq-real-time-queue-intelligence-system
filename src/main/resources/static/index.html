<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexQ — Smart Queue Management</title>
    <meta name="description" content="NexQ is an enterprise queue management system. Join queues, track your token, and get notified when it's your turn.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-bg">
    <div class="auth-particles"></div>
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                <!-- Logo -->
                <div class="text-center mb-4">
                    <div class="brand-logo mx-auto mb-3">
                        <i class="bi bi-collection"></i>
                    </div>
                    <h1 class="brand-title">NexQ</h1>
                    <p class="brand-subtitle">Smart Queue Management System</p>
                </div>

                <!-- Auth Card -->
                <div class="glass-card auth-card">
                    <!-- Tabs -->
                    <ul class="nav nav-pills auth-tabs mb-4" id="authTabs">
                        <li class="nav-item flex-fill">
                            <button class="nav-link active w-100" id="loginTab" onclick="showTab('login')">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </li>
                        <li class="nav-item flex-fill">
                            <button class="nav-link w-100" id="registerTab" onclick="showTab('register')">
                                <i class="bi bi-person-plus me-2"></i>Register
                            </button>
                        </li>
                    </ul>

                    <!-- Alert -->
                    <div id="authAlert" class="alert d-none" role="alert"></div>

                    <!-- Login Form -->
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="loginEmail"
                                       placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="loginPassword"
                                       placeholder="••••••••" required>
                                <button type="button" class="input-group-text" onclick="togglePassword('loginPassword')">
                                    <i class="bi bi-eye" id="loginPasswordIcon"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary-nexq w-100" id="loginBtn">
                            <span class="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                            <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
                        </button>
                    </form>

                    <!-- Register Form -->
                    <form id="registerForm" class="d-none" onsubmit="handleRegister(event)">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="regName"
                                       placeholder="John Doe" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="regEmail"
                                       placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="regPassword"
                                       placeholder="Min 6 characters" required minlength="6">
                                <button type="button" class="input-group-text" onclick="togglePassword('regPassword')">
                                    <i class="bi bi-eye" id="regPasswordIcon"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Account Type</label>
                            <select class="form-select" id="regRole">
                                <option value="USER">User (Join Queues)</option>
                                <option value="STAFF">Staff (Manage Queues)</option>
                                <option value="ADMIN">Admin (Full Access)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary-nexq w-100" id="registerBtn">
                            <span class="btn-text"><i class="bi bi-person-plus me-2"></i>Create Account</span>
                            <span class="spinner-border spinner-border-sm d-none" id="registerSpinner"></span>
                        </button>
                    </form>
                </div>

                <!-- Features -->
                <div class="row g-3 mt-3">
                    <div class="col-4">
                        <div class="feature-pill">
                            <i class="bi bi-lightning-charge text-warning"></i>
                            <span>Real-time</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="feature-pill">
                            <i class="bi bi-bell text-info"></i>
                            <span>Notifications</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="feature-pill">
                            <i class="bi bi-shield-check text-success"></i>
                            <span>Secure</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    // Redirect if already logged in
    if (localStorage.getItem('nexq_token')) {
        redirectByRole(localStorage.getItem('nexq_role'));
    }

    function showTab(tab) {
        document.getElementById('loginForm').classList.toggle('d-none', tab !== 'login');
        document.getElementById('registerForm').classList.toggle('d-none', tab !== 'register');
        document.getElementById('loginTab').classList.toggle('active', tab === 'login');
        document.getElementById('registerTab').classList.toggle('active', tab === 'register');
        hideAlert();
    }

    async function handleLogin(e) {
        e.preventDefault();
        setLoading('loginBtn', 'loginSpinner', true);
        hideAlert();
        try {
            const data = await apiPost('/api/auth/login', {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            });
            localStorage.setItem('nexq_token', data.token);
            localStorage.setItem('nexq_role', data.role);
            localStorage.setItem('nexq_user', JSON.stringify(data));
            showAlert('Login successful! Redirecting...', 'success');
            setTimeout(() => redirectByRole(data.role), 800);
        } catch (err) {
            showAlert(err.message || 'Invalid credentials', 'danger');
        } finally {
            setLoading('loginBtn', 'loginSpinner', false);
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        setLoading('registerBtn', 'registerSpinner', true);
        hideAlert();
        try {
            await apiPost('/api/auth/register', {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                role: document.getElementById('regRole').value
            });
            showAlert('Account created! Please sign in.', 'success');
            setTimeout(() => showTab('login'), 1500);
        } catch (err) {
            showAlert(err.message || 'Registration failed', 'danger');
        } finally {
            setLoading('registerBtn', 'registerSpinner', false);
        }
    }

    function redirectByRole(role) {
        const routes = { ADMIN: 'admin-dashboard.html', STAFF: 'staff-dashboard.html', USER: 'user-dashboard.html' };
        window.location.href = routes[role] || 'user-dashboard.html';
    }

    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = document.getElementById(id + 'Icon');
        if (input.type === 'password') {
            input.type = 'text'; icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password'; icon.className = 'bi bi-eye';
        }
    }
</script>
</body>
</html>
