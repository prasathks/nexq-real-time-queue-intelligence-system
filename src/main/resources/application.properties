# Server config
server.port=8080

spring.application.name=NexQ

# H2 in-memory database config for quick local testing
spring.datasource.url=jdbc:h2:mem:nexq_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT secrets
# Override via env var NEXQ_JWT_SECRET or create src/main/resources/application-secret.properties (git-ignored)
nexq.jwt.secret=${NEXQ_JWT_SECRET:change-me-before-production}
nexq.jwt.expiration=86400000

# Email config — override via env vars MAIL_USERNAME / MAIL_PASSWORD
# or create src/main/resources/application-secret.properties (git-ignored) for local dev
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Async threads
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=nexq-async-

# Cron scheduler config
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=nexq-scheduler-

# Token expiry
nexq.token.expiry.minutes=30

# ===========================
# Redis (local default)
# ===========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# If Redis is not running locally, disable the health check to allow the app to start
management.health.redis.enabled=false

# ===========================
# AI Microservice URL (local default)
# ===========================
ai.service.url=http://localhost:8000

# ===========================
# Logging
# ===========================
logging.level.com.nexq=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===========================
# Swagger / OpenAPI
# ===========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
